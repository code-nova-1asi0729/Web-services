# Spring Application Name
spring.application.name=Vigilia Platform

# Default to development when no explicit profile is provided
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.codenova.vigilia.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Spring Messages Configuration
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
